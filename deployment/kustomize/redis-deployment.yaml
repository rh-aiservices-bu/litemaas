apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-redis
  labels:
    app: litellm-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-redis
  template:
    metadata:
      labels:
        app: litellm-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # To enable authentication:
          # 1. Create a Secret: oc create secret generic redis-auth --from-literal=password=<your-password>
          # 2. Uncomment the command and env below.
          # 3. Uncomment the authenticated probe variants below (and remove the unauthenticated ones).
          # 4. Add REDIS_PASSWORD to backend-deployment.yaml.template and litellm-deployment.yaml
          #    (see commented blocks in those files).
          # command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          # env:
          #   - name: REDIS_PASSWORD
          #     valueFrom:
          #       secretKeyRef:
          #         name: redis-auth
          #         key: password
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: '64Mi'
              cpu: '50m'
            limits:
              memory: '128Mi'
              cpu: '200m'
          livenessProbe:
            exec:
              command:
                # Authenticated variant (uncomment when auth is enabled):
                # - sh
                # - -c
                # - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping
                # Unauthenticated (remove when auth is enabled):
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                # Authenticated variant (uncomment when auth is enabled):
                # - sh
                # - -c
                # - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping
                # Unauthenticated (remove when auth is enabled):
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
